# Dependabot configuration.
#
# Sibling configs (keep in sync when changing policy):
#   BrainCOGS/U19-pipeline-python, BrainCOGS/tech_calendar_streamlit,
#   BrainCOGS/WaterPubsGUI
#
# Every entry has a 7-day cooldown so a freshly published (possibly
# compromised) release is not proposed until it has had time to be yanked.
#
# A group without `applies-to` only batches scheduled version updates.
# Security updates are grouped separately, so each ecosystem declares both or
# the security fixes keep arriving as one PR per package.

version: 2

updates:
  #
  # GitHub Actions
  #
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7

    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "github-actions"

    commit-message:
      prefix: "ci"

    rebase-strategy: "auto"

    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  #
  # Docker -- one entry per directory containing a Dockerfile
  #
  - package-ecosystem: "docker"
    directories:
      - "/apache"
      - "/viewer"
    cooldown:
      default-days: 7

    schedule:
      interval: "monthly"
      day: "tuesday"
      time: "06:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "docker"

    commit-message:
      prefix: "docker"

    rebase-strategy: "auto"

    groups:
      docker:
        applies-to: "version-updates"
        patterns:
          - "*"
      docker-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  #
  # Python / uv
  #
  - package-ecosystem: "uv"
    directory: "/"
    cooldown:
      default-days: 7

    schedule:
      interval: "monthly"
      day: "wednesday"
      time: "06:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"

    commit-message:
      prefix: "deps"

    rebase-strategy: "auto"

    groups:
      python:
        applies-to: "version-updates"
        patterns:
          - "*"
      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"

    ignore:
      # datajoint 2.x renamed its config file to datajoint.json and ignores the
      # dj_local_conf.json this repo ships, so a 2.x bump breaks every
      # deployment. pyproject.toml pins datajoint<2 for the same reason. Remove
      # once the datajoint 2.x migration lands.
      - dependency-name: "datajoint"
        versions:
          - ">=2.0"
      # datajoint <2.0 imports pkg_resources (plugin.py, pulled in on every
      # `import datajoint`). setuptools 83.0.0 removed pkg_resources outright,
      # so any bump to >=82 makes `import datajoint` fail. Remove together with
      # the datajoint ignore above.
      - dependency-name: "setuptools"
        versions:
          - ">=82"

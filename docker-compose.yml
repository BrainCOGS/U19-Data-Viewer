version: '3'
services:
  apache:
    env_file:
      - .env
    build:
      context: ./apache
      dockerfile: 'pni-apache.Dockerfile'
    networks:
      - proxy
      - default
    volumes:
      - './apache/sites:/usr/local/apache2/conf/sites/:ro'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-http.entrypoints=http"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-https.entrypoints=https"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-https.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-https.tls.certresolver=letsencrypt-resolver"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-http.middlewares=${COMPOSE_PROJECT_NAME}-redirectscheme@docker"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-http.rule=Host(`${SERVICEHOSTNAME}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-https.rule=Host(`${SERVICEHOSTNAME}`)"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-redirectscheme.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-redirectscheme.redirectscheme.permanent=true"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    restart: unless-stopped
  flask-root:
    env_file:
      - .env
    build:
      context: .
      dockerfile: ./viewer/viewer.Dockerfile
    volumes:
      - .:/data_viewer
      # Subject photos live in the 'dailyposition' external blob store. The
      # container path matches the Linux deployment; set the host side with
      # U19_DJ_HOST_PATH (macOS mounts this at /Volumes/u19_dj). The "stores"
      # locations in dj_local_conf.json must point at /mnt/u19_dj to match, or
      # the photo panels degrade to "No image".
      - ${U19_DJ_HOST_PATH:-/mnt/u19_dj}:/mnt/u19_dj:ro
    expose:
      - 5000
    ports:
      # Local development: reach the bokeh server directly at
      # http://localhost:5001/ without going through apache/traefik.
      # Host port 5001 because macOS AirPlay Receiver occupies 5000.
      - "5001:5000"
    environment:
      # The browser's Origin carries the host port (5001), but the server only
      # knows the port it listens on (5000), so allow the published one too.
      - EXTRA_WS_ORIGINS=localhost:5001,127.0.0.1:5001
      # Re-root the external blob stores onto the container's mount point, so
      # dj_local_conf.json can keep the host's own paths.
      - DJ_STORE_ROOT=/mnt/u19_dj
    restart: unless-stopped


networks:
  proxy:
    external: true

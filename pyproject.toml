[project]
name = "princeton-u19-data-viewer"
version = "0.0.1"
description = "Data Viewer for Princeton Data pipeline"
authors = [{ name = "DataJoint", email = "info@datajoint.com" }]
license = "LGPL-3.0-or-later"
keywords = ["database", "viewer"]
requires-python = ">=3.10"
dependencies = [
    "datajoint<2",
    "bokeh>=3.8.2,<3.10.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["contrib", "docs", "tests*"]

[tool.uv]
# `uv audit` is still gated behind a preview flag. Declaring it here lets the
# command run without `--preview-features audit-command` on the command line.
preview-features = ["audit-command"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
